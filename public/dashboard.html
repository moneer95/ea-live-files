<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #f4f4f5;
      color: #18181b;
    }
    .header {
      background: #fff;
      border-bottom: 1px solid #e4e4e7;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .header nav {
      display: flex;
      gap: 0.75rem;
    }
    .header a {
      color: #2563eb;
      text-decoration: none;
      font-size: 0.9375rem;
    }
    .header a:hover { text-decoration: underline; }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .filter {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .filter label {
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
    }
    .filter input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #d4d4d8;
      border-radius: 8px;
      font-size: 1rem;
      background: #fff;
    }
    .filter input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }
    .summary {
      color: #52525b;
      font-size: 0.9375rem;
      margin: 0;
    }
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .file-card {
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 10px;
      padding: 1.25rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .file-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    .file-name {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      word-break: break-all;
    }
    .file-meta {
      margin: 0.35rem 0 0;
      font-size: 0.8125rem;
      color: #71717a;
    }
    .file-actions {
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      border: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary {
      background: #2563eb;
      color: #fff;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary {
      background: #f4f4f5;
      color: #18181b;
      border: 1px solid #d4d4d8;
    }
    .btn-secondary:hover { background: #e4e4e7; }
    .preview {
      margin: 0;
      font-size: 0.9375rem;
      line-height: 1.55;
      color: #3f3f46;
    }
    .empty, .error, .loading {
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 10px;
      padding: 2rem;
      text-align: center;
      color: #52525b;
    }
    .error { color: #b91c1c; background: #fef2f2; border-color: #fecaca; }
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }
    .pagination .btn[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .page-info {
      font-size: 0.875rem;
      color: #52525b;
      padding: 0 0.5rem;
    }
    .index-notice {
      margin: 0 0 1rem;
      padding: 0.75rem 0.9rem;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      color: #1d4ed8;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>PDF Dashboard</h1>
    <nav>
      <a href="/">Upload</a>
    </nav>
  </header>

  <main>
    <div class="toolbar">
      <div class="filter">
        <label for="contentFilter">Filter by PDF content</label>
        <input
          id="contentFilter"
          type="search"
          placeholder="Search inside PDF text…"
          autocomplete="off"
          disabled
        >
      </div>
      <p id="summary" class="summary">Loading files…</p>
      <p id="indexNotice" class="index-notice" hidden></p>
    </div>
    <div id="content" class="loading">Loading files…</div>
    <div id="pagination" class="pagination" hidden></div>
  </main>

  <script>
    var PAGE_SIZE = 10;
    var currentPage = 1;
    var currentQuery = "";
    var paginationMeta = { total: 0, totalPages: 0 };
    var searchTimer = null;
    var indexPollTimer = null;
    var loadRequestId = 0;
    var indexStatus = { ready: false, indexing: false, done: 0, total: 0 };

    function formatDate(iso) {
      return new Date(iso).toLocaleString(undefined, {
        dateStyle: "medium",
        timeStyle: "short",
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/'/g, "&#39;");
    }

    function setLoadingState(message) {
      var content = document.getElementById("content");
      content.className = "loading";
      content.textContent = message || "Loading files…";
      document.getElementById("pagination").hidden = true;
    }

    function updateIndexNotice(data) {
      var notice = document.getElementById("indexNotice");
      var status = (data && data.index) || indexStatus;
      var isIndexing = Boolean(data && data.indexing) || status.indexing || (currentQuery && !status.ready);

      if (!isIndexing) {
        notice.hidden = true;
        notice.textContent = "";
        return;
      }

      notice.hidden = false;
      if (status.total) {
        notice.textContent =
          "Indexing PDF text for search (" + status.done + " / " + status.total + "). " +
          (data && data.partial
            ? "Showing filename matches until indexing finishes."
            : "Results will update automatically when ready.");
      } else {
        notice.textContent = "Preparing PDF text index for search…";
      }
    }

    function clearIndexPoll() {
      if (indexPollTimer) {
        clearTimeout(indexPollTimer);
        indexPollTimer = null;
      }
    }

    function scheduleIndexPoll() {
      clearIndexPoll();
      indexPollTimer = setTimeout(function () {
        fetch("/api/files/index-status")
          .then(function (res) {
            if (!res.ok) throw new Error("Could not load index status.");
            return res.json();
          })
          .then(function (status) {
            indexStatus = status;
            updateIndexNotice({ index: status, indexing: status.indexing || !status.ready, partial: true });

            if (currentQuery && (status.indexing || !status.ready)) {
              scheduleIndexPoll();
              return;
            }

            clearIndexPoll();
            if (currentQuery && status.ready) {
              loadFiles();
            }
          })
          .catch(function () {
            scheduleIndexPoll();
          });
      }, 2000);
    }

    function updateSummary(data) {
      var summary = document.getElementById("summary");
      var total = paginationMeta.total || 0;
      var status = (data && data.index) || indexStatus;
      var isIndexing = Boolean(data && data.indexing) || status.indexing || (currentQuery && !status.ready);

      if (isIndexing && currentQuery && !total) {
        summary.textContent = "Preparing search index…";
        return;
      }

      if (!total) {
        summary.textContent = currentQuery
          ? "No PDFs match \"" + currentQuery + "\"."
          : "No PDF files uploaded yet.";
        return;
      }

      if (currentQuery) {
        summary.textContent =
          total + " file" + (total === 1 ? "" : "s") +
          " match \"" + currentQuery + "\"";
        return;
      }

      summary.textContent = total + " file" + (total === 1 ? "" : "s") + " available";
    }

    function renderFileCards(files) {
      return files.map(function (file) {
        var meta = file.sizeLabel + " · " + formatDate(file.modified);
        if (file.pages) meta += " · " + file.pages + " page" + (file.pages === 1 ? "" : "s");

        return (
          "<article class=\"file-card\">" +
            "<div class=\"file-top\">" +
              "<div>" +
                "<h2 class=\"file-name\">" + escapeHtml(file.name) + "</h2>" +
                "<p class=\"file-meta\">" + escapeHtml(meta) + "</p>" +
              "</div>" +
              "<div class=\"file-actions\">" +
                "<a class=\"btn btn-secondary\" href=\"" + escapeAttr(file.viewUrl) + "\">View</a>" +
                "<a class=\"btn btn-primary\" href=\"" + escapeAttr(file.downloadUrl) + "\" download>Download</a>" +
              "</div>" +
            "</div>" +
            "<p class=\"preview\">" + escapeHtml(file.preview) + "</p>" +
          "</article>"
        );
      }).join("");
    }

    function renderPagination() {
      var paginationEl = document.getElementById("pagination");
      var totalPages = paginationMeta.totalPages || 0;

      if (totalPages <= 1) {
        paginationEl.hidden = true;
        paginationEl.innerHTML = "";
        return;
      }

      paginationEl.hidden = false;
      paginationEl.innerHTML =
        "<button type=\"button\" class=\"btn btn-secondary\" id=\"prevPage\"" +
          (currentPage <= 1 ? " disabled" : "") + ">Previous</button>" +
        "<span class=\"page-info\">Page " + currentPage + " of " + totalPages + "</span>" +
        "<button type=\"button\" class=\"btn btn-secondary\" id=\"nextPage\"" +
          (currentPage >= totalPages ? " disabled" : "") + ">Next</button>";

      document.getElementById("prevPage").addEventListener("click", function () {
        if (currentPage > 1) {
          currentPage -= 1;
          loadFiles();
        }
      });

      document.getElementById("nextPage").addEventListener("click", function () {
        if (currentPage < totalPages) {
          currentPage += 1;
          loadFiles();
        }
      });
    }

    function renderFiles(files, data) {
      var content = document.getElementById("content");
      updateSummary(data);
      updateIndexNotice(data);

      var isIndexing = Boolean(data && (data.indexing || data.partial)) && currentQuery && !(data.index && data.index.ready);

      if (!paginationMeta.total) {
        content.className = isIndexing ? "loading" : "empty";
        content.innerHTML = isIndexing
          ? "<p>PDF text is being indexed so content search can run quickly. This happens once in the background.</p>"
          : (currentQuery
            ? "<p>No PDFs match your search. Try different words from the document text.</p>"
            : "<p>No files found. <a href=\"/\">Upload a PDF</a> to get started.</p>");
        document.getElementById("pagination").hidden = true;
        return;
      }

      content.className = "file-list";
      content.innerHTML = renderFileCards(files);
      renderPagination();
    }

    function loadFiles() {
      var requestId = ++loadRequestId;
      setLoadingState(currentQuery ? "Searching files…" : "Loading files…");

      var params = new URLSearchParams({
        page: String(currentPage),
        limit: String(PAGE_SIZE),
      });
      if (currentQuery) {
        params.set("q", currentQuery);
      }

      fetch("/api/files?" + params.toString())
        .then(function (res) {
          if (!res.ok) throw new Error("Could not load files.");
          return res.json();
        })
        .then(function (data) {
          if (requestId !== loadRequestId) return;

          paginationMeta = data.pagination || { total: 0, totalPages: 0 };
          currentPage = paginationMeta.page || currentPage;
          if (data.index) {
            indexStatus = data.index;
          }

          var filterInput = document.getElementById("contentFilter");
          filterInput.disabled = false;

          renderFiles(data.files || [], data);

          if (currentQuery && (data.indexing || data.partial || !indexStatus.ready)) {
            scheduleIndexPoll();
          } else {
            clearIndexPoll();
          }
        })
        .catch(function () {
          if (requestId !== loadRequestId) return;
          document.getElementById("summary").textContent = "";
          var content = document.getElementById("content");
          content.className = "error";
          content.textContent = "Failed to load the file list. Please refresh the page.";
          document.getElementById("pagination").hidden = true;
        });
    }

    document.getElementById("contentFilter").addEventListener("input", function (event) {
      var nextQuery = event.target.value.trim();
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        currentQuery = nextQuery;
        currentPage = 1;
        loadFiles();
      }, 350);
    });

    loadFiles();
  </script>
</body>
</html>
